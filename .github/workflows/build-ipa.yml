name: Build IPA
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare project
        run: |
          mkdir -p app/www
          cp -r index.html sw.js manifest.json app.css i18n.js core.js views.js more.js extra.js fonts icon-192.png icon-512.png app/www/
          cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6 @capacitor/camera@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "KOPT X" com.koptan.app --web-dir www
          node -e "const f='capacitor.config.json',c=require('./'+f);c.backgroundColor='#0b0c0f';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add ios
          PLIST=ios/App/App/Info.plist
          plutil -insert NSCameraUsageDescription -string "KOPT X uses the camera to take product and receipt photos." "$PLIST"
          plutil -insert NSPhotoLibraryUsageDescription -string "KOPT X lets you pick product and receipt photos from your library." "$PLIST"
          plutil -insert NSPhotoLibraryAddUsageDescription -string "KOPT X can save photos to your library." "$PLIST"
          plutil -replace CFBundleShortVersionString -string "9.0.0" "$PLIST"
          ICON=$(ls ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png | head -1)
          sips -z 1024 1024 www/icon-512.png --out "$ICON"
          npx cap sync ios
      - name: Build unsigned IPA
        run: |
          cd app/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "$GITHUB_WORKSPACE/KOPTX.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: KOPTX-ipa
          path: KOPTX.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-v9.0.0-build-${{ github.run_number }}"
          gh release create "$TAG" KOPTX.ipa --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "KOPT X iOS 9.0.0 (build ${{ github.run_number }})" --notes "Unsigned IPA: install with Sideloadly or AltStore." --latest=false
